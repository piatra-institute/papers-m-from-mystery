- id: dim27
  kind: computation
  passage: In SU(3) the product of two fundamentals contains no singlet, and the product of three contains
    exactly one, from the decomposition 3 × 3 × 3 = 1 + 8 + 8 + 10, verified by weight-multiset arithmetic
    with the dimension check summing to 27 (Figure 3, middle).
  evidence:
    file: simulation/output/results.json
    run_id: exact
    pointer: /fusion/dim_check_3x3x3
    reported: '27'
    decimals: 0
    units: dimension of 3 × 3 × 3
    conditions: exact integer and rational arithmetic
- id: su2-dim8
  kind: computation
  passage: In the fusion ring of SU(2), no irreducible above the trivial one factors as a tensor product
    of smaller nontrivial irreducibles, verified exhaustively through dimension 8, so every irreducible
    is tensor-prime.
  evidence:
    file: simulation/output/results.json
    run_id: exact
    pointer: /fusion/su2_max_dim
    reported: '8'
    decimals: 0
    units: largest SU(2) irreducible dimension checked
    conditions: exact integer and rational arithmetic
- id: kernel-def
  kind: definition
  passage: 'The finite kernel is a flagged exceptional Jordan structure with spectral data: the algebra,
    a real form, its cubic norm, a compatible tripotent flag, and a finite Hilbert space with charge conjugation,
    chirality and a finite Dirac operator, which carries whatever masses and Yukawa couplings the kernel
    can express.'
  rationale: Defines the proposed kernel; stated as architecture, not result.
- id: m-def
  kind: definition
  passage: 'The completion M is the quantum object the kernel would generate: observables assigned to
    regions in the sense of factorization algebras [@costello2023], sectors and defects, anomaly data
    with a chosen trivialization [@garciaetxebarria2018], and renormalization flow, followed by a quotient
    by every exact duality, so that two Lagrangians presenting the same observables, sectors, defects,
    anomalies and flow define the same point of M.'
  rationale: Defines M, including the quotient by exact dualities.
- id: hierarchy-def
  kind: definition
  passage: These failures motivate a hierarchy of 7 levels.
  rationale: Defines the seven atomicity predicates.
- id: axioms-no-numbers
  kind: assumption
  passage: Admissible kernels satisfy structural axioms (positivity, chirality, anomaly trivializability,
    a stable symmetry-breaking vacuum and no massless exotics), and the axioms may not contain the numbers
    3, 2, 1 or 16 in disguise.
  rationale: Methodological constraint on admissible kernels that makes a derivation distinguishable from
    an encoding.
- id: electron-conjecture
  kind: interpretation
  passage: The electron conjecture states that the dressed post-electroweak electron sector is bound-state
    atomic in M and remains so under every exact duality of M.
  rationale: Conjecture, explicitly unproved; its terms are defined in the hierarchy.
- id: summand-not-factor
  kind: interpretation
  passage: 'Both facts hold because a bound state is a summand of a tensor product and never a factor:
    a composite occurs inside $A \otimes B$ as a channel and is never equal to $A \otimes B$.'
  rationale: Explains the computed SU(2) fusion results (/fusion/su2_all_irreps_tensor_prime and su2_all_composite_as_summand
    both true).
- id: relativity
  kind: interpretation
  passage: Primality is relative to the category in which composition is defined.
  rationale: Conceptual conclusion of the final section.
- id: failure-criteria
  kind: normative
  passage: Because exceptional mathematics is especially vulnerable to retrospective pattern-matching,
    the programme specifies how it fails.
  rationale: Methodological commitment to stated failure conditions.
- id: baez-schwahn
  kind: source
  passage: Baez and Schwahn proved that inside the automorphism group of the exceptional Jordan algebra
    h3(O), the stabilizer of a qubit-sized subalgebra, intersected with the identity component of the
    stabilizer of a qutrit-sized subalgebra, is isomorphic to S(U(2)×U(3)), which equals [SU(3)×SU(2)×U(1)]/Z6,
    the Standard Model gauge group in its exact global form including the Z6 quotient [@baez2026b].
  evidence:
    citation_id: baez2026b
    locator: arXiv abstract
    verified: true
    verification_note: 'arXiv API abstract (arXiv:2606.15235): for Jordan subalgebras X ≅ h2(C) ⊂ B ≅
      h3(C), the stabilizer of X intersected with the identity component of the stabilizer of B is isomorphic
      to the Standard Model gauge group; described as symmetries of an ''octonionic qutrit'' acting unitarily
      on a qutrit and, within it, a qubit.'
- id: baez-e7
  kind: source
  passage: Baez showed that e7 decomposes into a subalgebra plus three 32-dimensional spaces, each transforming
    as one generation of fermions and their antiparticles, in a setting he credits to Nasmith, with mathematics
    going back to the E7 unification of Kugo and Yanagida; he presents the result as representation theory
    with a chosen embedding and not as a physical theory [@baez2026].
  evidence:
    citation_id: baez2026
    locator: arXiv abstract
    verified: true
    verification_note: 'arXiv API abstract (arXiv:2608.06271): e7 decomposes into a Lie subalgebra containing
      g_SM and three 32-dimensional subspaces, each the representation of one generation of fermions and
      antiparticles; setting due to Nasmith; mathematics underlying the E7 unification of Kugo and Yanagida.'
- id: tong-forms
  kind: source
  passage: Four theories with one matter content are distinguishable only by which probes exist, the modern
    form of Tong's observation that experiment has not chosen among them [@tong2017].
  evidence:
    citation_id: tong2017
    locator: Abstract
    verified: true
    verification_note: 'OpenAlex abstract: the gauge group is SU(3)×SU(2)×U(1)/Γ with Γ a subgroup of
      Z6 not determined by current experiments; line operators depend on Γ.'
- id: kapustin-witten
  kind: source
  passage: The rigorous connection between S-duality and the Langlands correspondence is established in
    twisted supersymmetric Yang-Mills theory, where Wilson and 't Hooft operators are exchanged under
    the dual group [@kapustin2007]; the modern spectral reading of the correspondence describes decomposition
    into atomic, monochromatic pieces [@benzvi2026], and its boundary form pairs dual Hamiltonian spaces
    [@benzvi2024].
  evidence:
    citation_id: kapustin2007
    locator: Abstract
    verified: true
    verification_note: 'OpenAlex abstract: geometric Langlands from a twisted N = 4 super Yang-Mills theory;
      electric-magnetic duality, Wilson and ''t Hooft operators. Ben-Zvi (2026) arXiv abstract: decomposition
      into monochromatic objects; Ben-Zvi, Sakellaridis and Venkatesh (2024): pairs Hamiltonian spaces
      for G and its dual group.'
- id: costello-factorization
  kind: source
  passage: 'The completion M is the quantum object the kernel would generate: observables assigned to
    regions in the sense of factorization algebras [@costello2023], sectors and defects, anomaly data
    with a chosen trivialization [@garciaetxebarria2018], and renormalization flow, followed by a quotient
