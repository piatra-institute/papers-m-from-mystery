    locator: arXiv abstract
    verified: true
    verification_note: 'arXiv API abstract (arXiv:2310.06137): factorization algebras as local-to-global
      objects articulating axioms satisfied by the observables of a quantum field theory.'
- id: farnsworth-exceptional
  kind: source
  passage: In the noncommutative construction of the Standard Model, the gauge and Higgs fields arise
    as inner fluctuations of a finite Dirac operator and the action follows from a spectral principle
    [@chamseddine1997], although generations and Yukawa couplings are inserted by hand [@devastato2019];
    extensions of that machinery to exceptional and Jordan settings are under construction [@farnsworth2025].
  evidence:
    citation_id: farnsworth2025
    locator: arXiv abstract
    verified: true
    verification_note: 'arXiv API abstract (arXiv:2506.21496): foundations for nonassociative spectral
      geometry extending Connes'' noncommutative geometry to finite geometries with exceptional symmetry.'
