  passage: The simulation verifies this constructively over charges up to 40 in absolute value, constructing
    an explicit determinant-one matrix for each of the 3,920 primitive vectors among 6,560, a density
    of 0.598 against the asymptotic value $6/\pi^2 = 0.6079$ (Figure 3, left).
  evidence:
