- id: nu-free
  kind: interpretation
  passage: Only the deletion of the right-handed neutrino, a singlet under every factor with hypercharge
    zero, breaks none (Figure 1, right).
  rationale: results.json /generation/deletion_break_counts/nbarR = 0 and /generation/deletions_that_break_nothing
    = [nbarR].
- id: z6-order
  kind: interpretation
  passage: The center classes of SU(3)×SU(2)×U(1) form the group Z3×Z2×Z6, and the six matter multiplets
    occupy classes that generate a Z6 inside it; the computation confirms that all six lie on the single
    diagonal generated by the class of the quark doublet.
  rationale: 'results.json /global_forms/n_center_classes = 36 and /global_forms/screening_subgroup_order
    = 6: the six matter classes generate a Z6 on the diagonal of the quark-doublet class.'
- id: lattice-sizes
  kind: interpretation
  passage: The allowed Wilson and 't Hooft line classes form lattices of sizes 6 by 1, 3 by 2, 2 by 3
    and 1 by 6, each with an integral Dirac pairing, and the four lattices are pairwise distinct (Figure
    2).
  rationale: results.json /global_forms/forms/*/electric_one_form_order and magnetic_one_form_order give
    (6,1), (3,2), (2,3), (1,6) for the forms 1, Z2, Z3, Z6; dirac_pairing_integral true for all four and
    n_distinct_lattices = 4.
- id: primitive-count
