abstract: 'Candidate criteria for the indivisibility of the electron fail: experiment bounds structure
  only down to its resolution. An irreducible representation label is also carried by the proton, a spin-half
  irreducible state made of quarks. Appearing as an elementary field depends on the presentation, since
  exact dualities exchange elementary fields with composites. The physical electron is also an infrared-dressed
  sector that no bare Wigner particle describes. We organize these obstructions into a research programme.
  Its starting point is a set of 2026 results: the exact Standard Model gauge group, including its global
  Z6 quotient, arises as a stabilizer inside the automorphisms of the exceptional Jordan algebra; the
  chiral content of one generation follows from Peirce decompositions of a Jordan pair; and e7 contains
  three generation-shaped spaces. We define a flagged Jordan-spectral kernel and its quantum completion
  M, quotiented by renormalization and exact duality, and state emergence as a classification problem
  whose axioms may not encode 3, 2, 1 or 16. In exact rational arithmetic, the 16-state generation satisfies
  all 5 consistency conditions, and deleting any multiplet except the right-handed neutrino breaks at
  least one. The 4 global forms of the gauge group, built as explicit line lattices, share identical matter.
  The SL(2,Z) orbit of the unit electric charge is the set of coprime vectors (density 0.598, against
  $6/\pi^2$ asymptotically), each decomposable into nonzero charges. In SU(2) fusion every irreducible
  is tensor-prime and every spin above one half is a summand of a product of smaller spins, so tensor-primality
  detects nothing. These results motivate a 7-level hierarchy of atomicity and an electron conjecture
  whose scope is limited to M.'
web_blurb: What would it mean mathematically for the electron to be indivisible? Exact computations show
  that charge labels, irreducibility and tensor-primality all fail as criteria, and motivate a duality-invariant
  hierarchy built on 2026 exceptional-Jordan results.
